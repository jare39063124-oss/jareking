# jareking macOS 构建流水线
#
# 为什么需要它（交接文档 §7 的硬约束）：
#   本项目的开发机是 **Windows**，而 electron-builder **无法在 Windows 上产出 macOS 产物**
#   （dmg / app bundle / 代码签名 / 公证全部依赖 macOS 工具链 hdiutil / codesign / notarytool）。
#   所以在 Windows 上"开发 macOS 版"的正确做法是：
#     ① 代码层的平台适配在本机完成（typecheck / test / Windows 构建全部可验）；
#     ② macOS 产包交给 GitHub Actions 的 macOS runner。
#
# 签名策略：
#   - 默认 **不签名**（CSC_IDENTITY_AUTO_DISCOVERY=false）→ 产出可直接安装测试的 dmg/zip，
#     但首次打开会被 Gatekeeper 拦截，需右键「打开」或 xattr 解除隔离（见 docs/macos-release.md）；
#   - 仓库配置以下 Secrets 后自动转为签名 + 公证（推荐正式分发）：
#       MAC_CSC_LINK          Developer ID Application 证书 .p12 的 base64
#       MAC_CSC_KEY_PASSWORD  .p12 密码
#       APPLE_ID              公证用 Apple ID
#       APPLE_APP_SPECIFIC_PASSWORD
#       APPLE_TEAM_ID
name: macOS build

on:
  workflow_dispatch:
    inputs:
      sign:
        description: '是否走签名+公证（需先配置仓库 Secrets）'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-14 = Apple Silicon 运行器；在其上可同时交叉构建 x64 与 arm64 产物
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          # 与 package.json 的 packageManager 保持一致
          version: 12.11.2

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # ── 为什么「先编译，后检查」而不反过来 ──────────────────────────────
      # 各 workspace 包的 package.json 都把类型入口指向自己构建产物 `types: ./dist/index.d.ts`，
      # 全新检出的仓库没有 dist —— 先跑 typecheck 会集体报 TS2307
      #   Cannot find module '@jareking/core' / '@jareking/writer' / '@jareking/pdf' ...
      # 本机开发时 dist 早就存在，所以这个坑只在 CI 首跑暴露（2026-10-17 连踩两次）。
      # 顺序固定为：编译（产出全部 dist + desktop out）→ 类型检查 → 单元测试 → 打包。
      - name: 编译（各包 dist + main/preload/renderer）
        env:
          CODEBUDDY_SAFE_DELETE_ENABLED: '0'
        run: pnpm build

      # 门禁范围说明（2026-10-17）：
      #   只跑 **@jareking/desktop 及其依赖图**（core / ai / writer / sheet / pdf / presentation），
      #   而不是根目录 `pnpm typecheck` / `pnpm test`。原因：`apps/mobile` 是与本流水线无关的
      #   并行在研轨道，其自身 typecheck 存在既有红项（webStore 的 IDB 类型），会让 macOS
      #   打包假失败。mobile 的修复由移动端轨道自行负责，不受本工作流阻断。
      #   `...` 后缀 = 该包 + 其全部依赖。
      - name: 类型检查（desktop 及其依赖图）
        run: pnpm --filter @jareking/desktop... typecheck

      - name: 单元测试（desktop 及其依赖图）
        run: pnpm --filter @jareking/desktop... test

      # ── 打包：签名版 / 未签名版二选一 ──────────────────────────────────
      - name: 打包 dmg + zip（签名 + 公证）
        if: ${{ inputs.sign }}
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CODEBUDDY_SAFE_DELETE_ENABLED: '0'
        run: pnpm --filter @jareking/desktop package:mac

      - name: 打包 dmg + zip（未签名，仅内测）
        if: ${{ !inputs.sign }}
        env:
          # 显式关闭证书自动发现：无证书环境下 electron-builder 直接跳过签名而不是报错
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          CODEBUDDY_SAFE_DELETE_ENABLED: '0'
        run: pnpm --filter @jareking/desktop package:mac

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: jareking-macos-${{ github.ref_name }}
          # electron-builder 输出目录见 apps/desktop/electron-builder.yml → directories.output
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 14

      - name: 打印产物清单（体积敏感项目：必须能看到实际大小）
        run: ls -lh apps/desktop/release/
