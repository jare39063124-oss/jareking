# electron-builder 配置（T0.5 桌面能力）

appId: com.jareking.app
productName: jareking

# ── 安装包体积优化（2026-10-15 体积专项）──────────────────────────────
# 1) compression: maximum —— NSIS 采用最高压缩比（LZMA）
# 2) electronLanguages —— 只保留中英文；默认打包 55 种语言约 49MB，可省约 47MB
# 3) asar 内的 node_modules 由 apps/desktop/package.json 的依赖归属决定：
#    仅 dependencies（@jareking/core、electron-updater）进包；
#    @univerjs/@tiptap/konva/pdfjs-dist/react 等 renderer-only 依赖已移入
#    devDependencies，不再重复打进 asar（此前重复约 259MB）。
compression: maximum
electronLanguages:
  - zh-CN
  - en-US

# 打包输出目录（相对 apps/desktop）
directories:
  output: release

# Windows 安装包：NSIS + x64；oneClick=false 允许用户选择安装目录
win:
  target:
    - target: nsis
      arch: [x64]
  # icon: resources/icon.ico  # 待 resources/icon.png 就绪后添加 icon 字段

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# ── macOS 打包（2026-10-17 macOS 版）─────────────────────────────────
# 目标：dmg（分发）+ zip（electron-updater 增量更新用），x64 + arm64 双架构
#   · arm64 = Apple Silicon（M1/M2/M3/M4），x64 = Intel Mac；
#   · 双架构分别出包（不合并 universal，体积可省约 2 倍，符合"体积敏感"约束）；
#   · zip 是 macOS 自动更新的必需产物（Squirrel.Mac 只吃 zip），dmg 只用于人工安装。
#
# 签名策略（**当前故意不写 identity 字段**）：
#   · 不写 = 交给 electron-builder 自动发现证书；CI/无证书环境会自动跳过签名并告警，
#     不会硬失败（这就是"本地可跳过签名"的实现方式，不要写死 identity: null，
#     否则将来拿到证书还得回来改配置）；
#   · 有证书时通过环境变量注入：CSC_LINK（.p12 的 base64 或路径）+ CSC_KEY_PASSWORD；
#   · 显式跳过签名：CSC_IDENTITY_AUTO_DISCOVERY=false。
# 公证（notarize）：electron-builder 26 默认关闭。正式分发需 Apple Developer($99/年) +
#   Apple ID / App Store Connect API Key，并启用 notarize，详见 docs/macos-release.md。
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  category: public.app-category.productivity
  # 开启 Hardened Runtime（公证的前置条件；未签名时该开关无副作用）
  hardenedRuntime: true
  # Gatekeeper 在签名前的静态评估会拦未签名构建，交给公证流程判定
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  # 产物命名带架构后缀，避免 x64 / arm64 同名覆盖
  artifactName: ${productName}-${version}-${arch}.${ext}
  # icon 待 resources/icon.icns（1024×1024）就绪后补：icon: resources/icon.icns
  # 最低系统版本不在此硬编码（随 Electron 44 的 Electron 官方下限走），
  # 若需收紧请先查 Electron 44 发布说明再填 LSMinimumSystemVersion

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  # 拖拽式安装布局：左侧 app、右侧 Applications 软链（electron-builder 默认即此布局）
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# 文件关联：docx / xlsx / pptx / pdf 双击用 jareking 打开（对应 spec 4.1）
fileAssociations:
  - ext:
      - doc
      - docx
    role: Editor
    name: jareking.Document
    description: "jareking 文档"
  - ext:
      - xls
      - xlsx
    role: Editor
    name: jareking.Spreadsheet
    description: "jareking 表格"
  - ext:
      - ppt
      - pptx
    role: Editor
    name: jareking.Presentation
    description: "jareking 演示"
  - ext:
      - pdf
    role: Editor
    name: jareking.Pdf
    description: "jareking PDF 文档"

# 主进程/预加载/渲染进程产物统一打asar
asar: true

files:
  - out/**
  - package.json
  # 依赖精简（体积专项 2026-10-15）：运行期不需要的类型声明/源码映射/测试/文档一律不打进 asar
  - "!node_modules/**/*.d.ts"
  - "!node_modules/**/*.d.mts"
  - "!node_modules/**/*.d.cts"
  - "!node_modules/**/*.map"
  - "!node_modules/**/{test,tests,__tests__,spec,specs,docs,example,examples,benchmark,benchmarks}/**"
  - "!node_modules/**/*.md"
  - "!node_modules/**/LICENSE*"

# 发布渠道：GitHub Releases（组织 jareking-office，仓库待建）；T8.4 落地自动更新
publish:
  provider: github
  owner: jareking-office
  repo: jareking
